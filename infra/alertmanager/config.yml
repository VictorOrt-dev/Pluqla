global:
  resolve_timeout: 5m
  # Slack webhook URL (replace with your actual webhook)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alert distribution
route:
  # Default receiver
  receiver: 'default'

  # Group alerts by these labels to reduce noise
  group_by: ['alertname', 'component', 'severity']

  # How long to wait before sending initial notification
  group_wait: 10s

  # How long to wait before sending notification about new alerts in group
  group_interval: 10s

  # How long to wait before re-sending notification
  repeat_interval: 3h

  # Child routes for specific alert types
  routes:
    # Critical alerts go to pagerduty AND slack
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h

    # Auth-related alerts
    - match:
        component: auth
      receiver: 'auth-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    # Database alerts
    - match:
        component: database
      receiver: 'database-alerts'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

    # Compliance alerts
    - match:
        component: compliance
      receiver: 'compliance-alerts'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

# Alert receivers
receivers:
  # Default receiver (Slack general channel)
  - name: 'default'
    slack_configs:
      - channel: '#pluqla-alerts'
        title: '{{ .Status | toUpper }}{{ if eq .Status "firing" }} :fire:{{ else }} :white_check_mark:{{ end }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Severity:* {{ .Labels.severity }}
            *Component:* {{ .Labels.component }}
            *Description:* {{ .Annotations.description }}
            *Summary:* {{ .Annotations.summary }}
          {{ end }}
        send_resolved: true

  # Critical alerts (PagerDuty + Slack)
  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          severity: '{{ .CommonLabels.severity }}'
          component: '{{ .CommonLabels.component }}'
          firing: '{{ .Alerts.Firing | len }}'
    slack_configs:
      - channel: '#pluqla-critical'
        title: ':rotating_light: CRITICAL ALERT :rotating_light:'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Component:* {{ .Labels.component }}
            *Description:* {{ .Annotations.description }}
            *Summary:* {{ .Annotations.summary }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Auth alerts
  - name: 'auth-alerts'
    slack_configs:
      - channel: '#pluqla-auth'
        title: 'Authentication Alert'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Severity:* {{ .Labels.severity }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: '${SECURITY_ALERT_EMAIL}'
        from: 'alertmanager@pluqla.com'
        smarthost: 'smtp.example.com:587'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'Pluqla Auth Alert: {{ .CommonLabels.alertname }}'

  # Database alerts
  - name: 'database-alerts'
    slack_configs:
      - channel: '#pluqla-database'
        title: 'Database Alert'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Severity:* {{ .Labels.severity }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'devops@pluqla.com'
        from: 'alertmanager@pluqla.com'
        smarthost: 'smtp.example.com:587'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'Pluqla DB Alert: {{ .CommonLabels.alertname }}'

  # Compliance alerts
  - name: 'compliance-alerts'
    slack_configs:
      - channel: '#pluqla-compliance'
        title: 'Compliance Alert'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Labels.alertname }}
            *Severity:* {{ .Labels.severity }}
            *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
    email_configs:
      - to: 'compliance@pluqla.com,security@pluqla.com'
        from: 'alertmanager@pluqla.com'
        smarthost: 'smtp.example.com:587'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'Pluqla Compliance Alert: {{ .CommonLabels.alertname }}'

# Inhibition rules (prevent certain alerts when others are firing)
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component']

  # Inhibit all if API is down
  - source_match:
      alertname: 'APIDown'
    target_match_re:
      alertname: '.+'
    equal: ['job']
