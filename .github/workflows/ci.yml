name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch: # Allow manual trigger

env:
  # CI environment
  CI: true
  NODE_ENV: test
  GITHUB_ACTIONS: true

  # Database for unit tests (SQLite for speed)
  DATABASE_URL: file:./test.db
  TEST_DATABASE_URL: file:./test.db

  # Mock configurations for unit tests
  JWT_SECRET: unit_test_jwt_secret_32_characters_long_for_testing_only_never_production
  JWT_REFRESH_SECRET: unit_test_refresh_secret_32_characters_long_for_testing_only_never_prod
  JWT_EMAIL_SECRET: unit_test_email_secret_32_characters_long_for_testing_only_never_prod
  JWT_PASSWORD_RESET_SECRET: unit_test_reset_secret_32_characters_long_for_testing_only_never_prod
  JWT_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d

  # Mock external services for unit tests
  EMAIL_HOST: mock
  EMAIL_FROM: test@pluqla.app
  MOCK_EMAIL_SERVICE: true
  FINANCIAL_ENCRYPTION_KEY: unit_test_encryption_key_32_characters_long_for_testing_only_never_prod
  BCRYPT_ROUNDS: 4  # Faster for unit tests

  # Feature flags for testing
  FEATURE_AI_EXTERNAL_API: false
  FEATURE_ANALYTICS_TRACKING: false
  FEATURE_EMAIL_NOTIFICATIONS: true
  FEATURE_CACHE_REDIS: false

  # Performance settings for unit tests
  RATE_LIMIT_WINDOW_MS: 60000
  RATE_LIMIT_MAX_REQUESTS: 1000

  # Test settings
  SKIP_EMAIL_VERIFICATION: false
  TEST_MODE: true

jobs:
  # ==============================================================================
  # 🧹 CODE QUALITY & LINTING
  # ==============================================================================
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        workspace: [client, server]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.workspace }}/package-lock.json

      - name: 🔧 Install dependencies
        run: |
          npm ci
          cd ${{ matrix.workspace }} && npm ci

      - name: 🔍 Run ESLint (Backend)
        if: matrix.workspace == 'server'
        run: |
          cd server
          echo "Running ESLint on server..."
          npm run lint

      - name: 🔍 Run ESLint (Frontend)
        if: matrix.workspace == 'client'
        run: |
          cd client
          echo "Running ESLint on client..."
          npx eslint src/ --ext .js,.jsx --format=compact --max-warnings=0

      - name: 🎨 Check code formatting (Backend)
        if: matrix.workspace == 'server'
        run: |
          cd server
          echo "Checking Prettier formatting..."
          npx prettier --check src/ || {
            echo "❌ Code formatting issues found. Run 'npm run format' to fix."
            exit 1
          }

      - name: 🎨 Check code formatting (Frontend)
        if: matrix.workspace == 'client'
        run: |
          cd client
          echo "Checking Prettier formatting..."
          npx prettier --check src/ --ignore-path .gitignore || {
            echo "❌ Code formatting issues found. Run 'prettier --write src/' to fix."
            exit 1
          }

      - name: 📊 Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results-${{ matrix.workspace }}
          path: |
            ${{ matrix.workspace }}/eslint-report.json
            ${{ matrix.workspace }}/prettier-report.txt
          retention-days: 3

  # ==============================================================================
  # 🧪 UNIT TESTS
  # ==============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        workspace: [client, server]
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.workspace }}/package-lock.json

      - name: 🔧 Install dependencies
        run: |
          npm ci
          cd ${{ matrix.workspace }} && npm ci

      - name: 🗄️ Setup test database (Backend)
        if: matrix.workspace == 'server'
        run: |
          cd server
          echo "Setting up test database..."
          npx prisma generate
          npx prisma migrate deploy
          echo "Database setup complete!"

      - name: 🧪 Run unit tests (Backend)
        if: matrix.workspace == 'server'
        run: |
          cd server
          echo "Running server unit tests with coverage..."
          npm run test:coverage -- --ci --watchAll=false --passWithNoTests
        continue-on-error: false

      - name: 🧪 Run unit tests (Frontend)
        if: matrix.workspace == 'client'
        run: |
          cd client
          echo "Running client unit tests with coverage..."
          npm test -- --ci --coverage --watchAll=false --passWithNoTests
        env:
          CI: true
        continue-on-error: false

      - name: 📊 Upload test coverage (Backend)
        if: matrix.workspace == 'server'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server-${{ matrix.node-version }}
          path: |
            server/coverage/
            server/junit.xml
          retention-days: 7

      - name: 📊 Upload test coverage (Frontend)
        if: matrix.workspace == 'client'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-client-${{ matrix.node-version }}
          path: |
            client/coverage/
          retention-days: 7

      - name: 💬 Comment test coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let comment = `## 🧪 Unit Test Coverage - ${{ matrix.workspace }}\n\n`;

            try {
              // Try to read coverage summary
              const workspace = '${{ matrix.workspace }}';
              const summaryPath = `${workspace}/coverage/coverage-summary.json`;

              if (fs.existsSync(summaryPath)) {
                const coverage = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
                const total = coverage.total;

                comment += `| Metric | Coverage |\n`;
                comment += `|--------|----------|\n`;
                comment += `| Lines | ${total.lines.pct}% |\n`;
                comment += `| Functions | ${total.functions.pct}% |\n`;
                comment += `| Branches | ${total.branches.pct}% |\n`;
                comment += `| Statements | ${total.statements.pct}% |\n\n`;

                // Add status emoji based on coverage
                const avgCoverage = (total.lines.pct + total.functions.pct + total.branches.pct + total.statements.pct) / 4;
                if (avgCoverage >= 80) {
                  comment += `✅ **Status**: Excellent coverage (${avgCoverage.toFixed(1)}%)`;
                } else if (avgCoverage >= 70) {
                  comment += `⚠️ **Status**: Good coverage (${avgCoverage.toFixed(1)}%) - aim for 80%+`;
                } else {
                  comment += `❌ **Status**: Low coverage (${avgCoverage.toFixed(1)}%) - please add more tests`;
                }
              } else {
                comment += `📊 Coverage report will be available in artifacts.`;
              }

            } catch (error) {
              comment += `⚠️ Could not read coverage report. Check artifacts for details.`;
            }

            // Only comment once per workspace to avoid spam
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c =>
              c.body.includes(`Unit Test Coverage - ${{ matrix.workspace }}`) &&
              c.user.login === 'github-actions[bot]'
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

  # ==============================================================================
  # 🔒 SECURITY SCANNING
  # ==============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: 🔒 Run npm audit (Root)
        run: |
          echo "Running npm audit on root workspace..."
          npm audit --audit-level high --json > audit-root.json || true

      - name: 🔒 Run npm audit (Frontend)
        run: |
          cd client
          echo "Running npm audit on client..."
          npm audit --audit-level high --json > ../audit-client.json || true

      - name: 🔒 Run npm audit (Backend)
        run: |
          cd server
          echo "Running npm audit on server..."
          npm audit --audit-level high --json > ../audit-server.json || true

      - name: 🔍 Advanced security check with audit-ci
        run: |
          echo "Running comprehensive security audit..."
          npx audit-ci --config .audit-ci.json --output-format json > security-report.json || {
            echo "Security vulnerabilities found. Check the report."
            cat security-report.json
            exit 1
          }

      - name: 🛡️ Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets and sensitive data..."
          # Check for potential secrets in code
          if grep -r -n -E "(password|secret|key|token).*['\"][a-zA-Z0-9]{20,}" src/ --include="*.js" --include="*.jsx"; then
            echo "❌ Potential hardcoded secrets found!"
            exit 1
          fi

          # Check for common secret patterns
          if grep -r -n -E "(api_key|apikey|api-key)" src/ --include="*.js" --include="*.jsx"; then
            echo "❌ Potential API keys found!"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

      - name: 📊 Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            audit-*.json
            security-report.json
          retention-days: 7

  # ==============================================================================
  # 🚀 BUILD VERIFICATION
  # ==============================================================================
  build-test:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality, unit-tests]

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 🔧 Install dependencies
        run: |
          npm ci
          cd client && npm ci
          cd ../server && npm ci

      - name: 🗄️ Setup database for build test
        run: |
          cd server
          echo "Generating Prisma client for build..."
          npx prisma generate

      - name: 🏗️ Build client
        run: |
          cd client
          echo "Building client for production..."
          npm run build

      - name: 📦 Analyze bundle size
        run: |
          cd client
          echo "Analyzing client bundle size..."
          npx webpack-bundle-analyzer build/static/js/*.js --report --mode static --report-filename ../bundle-report.html || echo "Bundle analyzer not available"

      - name: 🔍 Verify server can start
        run: |
          cd server
          echo "Verifying server can start..."
          timeout 10s npm start || {
            echo "✅ Backend startup verification completed"
          }

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.node-version }}
          path: |
            client/build/
            bundle-report.html
          retention-days: 3

  # ==============================================================================
  # 📋 FINAL SUMMARY
  # ==============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, unit-tests, security-scan, build-test]
    if: always()

    steps:
      - name: 📊 Create CI summary
        run: |
          echo "# 🚀 Continuous Integration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 Quality Gates Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Quality & Linting**: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests**: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scanning**: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Verification**: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Quality Standards Verified" >> $GITHUB_STEP_SUMMARY
          echo "- 🧹 **Code Style**: ESLint + Prettier formatting" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 **Testing**: Unit test coverage across Node.js 18.x & 20.x" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 **Security**: Dependency audit + secret scanning" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ **Build**: Production build verification" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Bundle**: Size analysis for optimization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎉 Next Steps" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.unit-tests.result }}" == "success" && "${{ needs.security-scan.result }}" == "success" && "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ **All quality gates passed!** Ready for E2E testing and merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some quality gates failed.** Please review the failing jobs and fix issues." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🎯 Set job status
        run: |
          if [[ "${{ needs.code-quality.result }}" == "success" && "${{ needs.unit-tests.result }}" == "success" && "${{ needs.security-scan.result }}" == "success" && "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ All CI checks passed successfully!"
            exit 0
          else
            echo "❌ One or more CI checks failed"
            exit 1
          fi