# Alertmanager Configuration for Pluqla

global:
  resolve_timeout: 5m
  # Slack webhook (configure via environment variable or replace with your webhook)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# Templates for alert notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default-receiver'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      group_wait: 0s
      repeat_interval: 1h

    # Warning alerts - less frequent notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts - batched notifications
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      group_interval: 10m
      repeat_interval: 24h

# Receivers define where and how to send notifications
receivers:
  # Default receiver
  - name: 'default-receiver'
    slack_configs:
      - channel: '#pluqla-alerts'
        title: '🔔 Pluqla Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#pluqla-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .CommonLabels.severity }}
          *Component:* {{ .CommonLabels.component }}
          *Description:*
          {{ range .Alerts }}
          • {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: danger

    # Email for critical alerts (configure SMTP if needed)
    # email_configs:
    #   - to: 'oncall@pluqla.com'
    #     from: 'alerts@pluqla.com'
    #     smarthost: 'smtp.gmail.com:587'
    #     auth_username: 'alerts@pluqla.com'
    #     auth_password: '${SMTP_PASSWORD}'
    #     headers:
    #       Subject: '🚨 CRITICAL ALERT: {{ .GroupLabels.alertname }}'

    # PagerDuty for critical alerts (configure if needed)
    # pagerduty_configs:
    #   - service_key: '${PAGERDUTY_SERVICE_KEY}'

  # Warning alerts
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#pluqla-warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *Alert:* {{ .GroupLabels.alertname }}
          *Component:* {{ .CommonLabels.component }}
          {{ range .Alerts }}
          • {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: warning

  # Info alerts
  - name: 'info-alerts'
    slack_configs:
      - channel: '#pluqla-info'
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Don't alert on high error rates if the server is down
  - source_match:
      alertname: 'ApiServerDown'
    target_match:
      component: 'api'
    equal: ['cluster']

  # Don't alert on slow queries if database is having errors
  - source_match:
      alertname: 'HighDatabaseErrorRate'
    target_match:
      alertname: 'SlowDatabaseQueries'
    equal: ['cluster']

  # Suppress warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster']
