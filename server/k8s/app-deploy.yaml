# App deployment with readiness/liveness probes
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pluqla-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pluqla-api
  template:
    metadata:
      labels:
        app: pluqla-api
    spec:
      containers:
      - name: api
        image: pluqla-api:latest
        ports:
        - containerPort: 3004
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: METRICS_ENABLED
          value: "true"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pluqla-api
  labels:
    app: pluqla-api
spec:
  ports:
  - port: 3004
    targetPort: 3004
    name: http
  selector:
    app: pluqla-api
